<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Merenda</title>
<style>
:root{--g9:#0d3b2e;--g7:#1f6b4d;--bg:#f4f6f1;--ink:#16241d;--mut:#5d6b63;--line:#d9dfd6;--warn:#f5b942;--red:#b3261e;--pur:#7a3b9a}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:28px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 20px;max-width:560px}
header{background:var(--g9);color:#fff;padding:14px 28px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.brand{font-size:20px;font-weight:700}.brand small{display:block;font-size:12px;font-weight:400;opacity:.8}
.who{font-size:13px;display:flex;gap:8px;align-items:center}
.who a{color:#fff;cursor:pointer;text-decoration:underline}
.badge{background:var(--pur);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
nav{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfe3d8;font:inherit;font-weight:600;padding:11px 16px;cursor:pointer;border-radius:10px 10px 0 0}
nav button.on{background:var(--bg);color:var(--ink)}
.demo{background:var(--warn);text-align:center;font-size:13px;padding:10px 20px}
main{max-width:820px;margin:0 auto;padding:26px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.card.off{background:none;border-style:dashed;opacity:.55;pointer-events:none}
label,.lb{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g7);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1.5px solid var(--g7);background:#fff;color:var(--g7);cursor:pointer}
.btn.p{background:var(--g7);color:#fff}.btn.d{border-color:var(--red);color:var(--red)}
.btn.s{padding:5px 14px;font-size:13px}.btn:disabled{background:#cbd5ce;border-color:#cbd5ce;color:#6d7a72;cursor:not-allowed}
.chip{font:inherit;font-weight:600;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer}
.chip.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}.err{color:var(--red);font-size:13px;margin-top:8px}.ok{color:var(--g7);font-size:13px;margin-top:8px}
.ing{display:grid;grid-template-columns:1fr 110px 90px 40px;gap:8px;margin-bottom:8px}
.grp{margin:26px 0 8px;font-weight:700;font-size:18px}.grp small{font-weight:400;font-size:13px;color:var(--mut);margin-left:6px}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meal b{display:block}.meal small{color:var(--mut)}
details{margin-top:6px;font-size:14px;color:var(--g7)}details ul{margin:6px 0 0;padding-left:20px;color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:700;color:var(--g7);line-height:1}
.empty{text-align:center;color:var(--mut);padding:24px;border:1px dashed var(--line);border-radius:12px}
.auth{max-width:420px;margin:40px auto}.auth .card{padding:26px}.auth input{width:100%}
.auth .demo{border-radius:10px;margin-bottom:16px;padding:10px}
.lnk{color:var(--ink);cursor:pointer;text-decoration:underline;font-size:14px}
@media(max-width:620px){.ing{grid-template-columns:1fr 1fr}}
@media print{header,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Armazenamento local (sem banco) ===== */
const K = { meals:'cm_meals', users:'cm_users', acc:'cm_acc', com:'cm_com', ses:'cm_ses' };
const ADMIN = { email:'admin@escola.com', pass:'admin123' };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e){ return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };
const PER = { cafe:'Café da manhã', almoco:'Almoço', lanche:'Lanche da tarde' };
const ROLES = { admin:'Administrador', secretaria:'Secretaria', chefe:'Chefe de Cozinha', cozinha:'Cozinha' };
const TABS = [
  ['com','Comunicação de alunos',['admin','secretaria','chefe']],
  ['cad','Cadastro de refeições',['admin','chefe']],
  ['calc','Cálculo do dia',['admin','chefe','cozinha']],
  ['painel','Painel da cozinha',['admin','chefe','cozinha']],
  ['usr','Usuários',['admin']]
];
const SEED = [
 'Cuscuz com ovo e leite|cafe|Cuscuz (flocão):40:g;Ovo:50:g;Leite:100:ml;Margarina:5:g;Açúcar:5:g',
 'Pão com margarina e achocolatado|cafe|Pão francês:50:g;Margarina:8:g;Achocolatado em pó:15:g;Leite:150:ml',
 'Mingau de aveia com banana|cafe|Aveia em flocos:25:g;Leite:150:ml;Banana:1:un;Açúcar:8:g',
 'Arroz, feijão e frango assado|almoco|Arroz:60:g;Feijão:50:g;Frango (coxa/sobrecoxa):120:g;Cebola:10:g;Alho:2:g;Óleo:5:ml',
 'Macarrão à bolonhesa com salada|almoco|Macarrão:80:g;Carne moída:60:g;Molho de tomate:50:g;Cebola:10:g;Alface:20:g;Tomate:30:g;Óleo:5:ml',
 'Baião de dois com carne de sol|almoco|Arroz:50:g;Feijão-de-corda:40:g;Carne de sol:70:g;Queijo coalho:20:g;Cebola:10:g;Coentro:2:g',
 'Peixe ao molho com arroz e legumes|almoco|Filé de peixe:110:g;Arroz:60:g;Cenoura:30:g;Chuchu:30:g;Molho de tomate:30:g;Óleo:5:ml',
 'Bolo de cenoura com suco|lanche|Farinha de trigo:30:g;Cenoura:25:g;Ovo:0.3:un;Açúcar:15:g;Óleo:5:ml;Suco de fruta (polpa):50:g',
 'Fruta com biscoito|lanche|Fruta (banana ou maçã):1:un;Biscoito:20:g',
 'Iogurte com granola|lanche|Iogurte:120:ml;Granola:20:g;Mel:5:g'
];
const seedMeals = () => SEED.map((s,i) => { const [name,period,ing] = s.split('|');
  return { id:'s'+i, name, period, ings: ing.split(';').map(x => { const [n,q,u] = x.split(':'); return { n, q:+q, u } }) } });

let S = { user:load(K.ses,null), tab:'com', auth:'login', meals:load(K.meals,null) || seedMeals(),
  users:load(K.users,[]), acc:load(K.acc,[]), com:load(K.com,[]),
  calc:{ total:'', period:null, meal:null, report:null }, form:null, msg:'' };
if (!load(K.meals,null)) save(K.meals,S.meals);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (Math.round(n*100)/100).toLocaleString('pt-BR');
function fmtQ(q,u){ if(u==='g'&&q>=1000) return fmtN(q/1000)+' kg'; if(u==='ml'&&q>=1000) return fmtN(q/1000)+' L'; return fmtN(q)+' '+u }
const todayLabel = () => new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
const latestCom = () => { const t = new Date().toDateString(); return [...S.com].reverse().find(c => new Date(c.at).toDateString()===t) };
const role = () => !S.user ? null : S.user.email===ADMIN.email ? 'admin' : (S.acc.find(a => a.email===S.user.email)||{}).role || null;

function go(tab){ S.tab = tab; S.msg=''; render() }
function say(m){ S.msg = m; render() }

/* ===== Layout ===== */
function render(){
  if(!S.user) return $('app').innerHTML = authView();
  const r = role();
  if(!r) return $('app').innerHTML = `<div class="auth"><div class="card"><h1>Aguardando liberação</h1>
    <p class="sub">Sua conta (${esc(S.user.email)}) foi criada, mas o administrador ainda não liberou um perfil de acesso. Peça a liberação e entre de novo.</p>
    <button class="btn p" onclick="logout()">Sair</button></div></div>`;
  const tabs = TABS.filter(t => t[2].includes(r));
  if(!tabs.find(t => t[0]===S.tab)) S.tab = tabs[0][0];
  const views = { com:comView, cad:cadView, calc:calcView, painel:painelView, usr:usrView };
  $('app').innerHTML = `<header class="noprint"><div class="top"><div class="brand">Calculadora de Merenda<small>Sistema interno</small></div>
    <div class="who"><span class="badge">${ROLES[r]}</span><span>${esc(S.user.name||S.user.email.split('@')[0])}</span><a onclick="logout()">Sair</a></div></div>
    <nav>${tabs.map(t => `<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav></header>
    <main>${views[S.tab]()}</main>`;
}

/* ===== Tela 5: autenticação ===== */
function authView(){
  const login = S.auth==='login';
  return `<div class="auth"><div class="card"><h1>Calculadora de Merenda</h1>
  <p class="sub" style="margin-bottom:8px">${login?'Entre com seu e-mail e senha.':'Crie sua conta. Depois, peça para o administrador liberar seu perfil de acesso.'}</p>
  ${login?'':`<label for="an">Nome</label><input id="an" placeholder="Seu nome">`}
  <label for="ae">E-mail</label><input id="ae" type="email" placeholder="voce@escola.gov.br" value="${login?'':''}">
  <label for="ap">Senha</label><input id="ap" type="password" placeholder="Mínimo 6 caracteres">
  ${S.msg?`<div class="err">${S.msg}</div>`:''}
  <div style="margin-top:18px"><button class="btn p" onclick="${login?'doLogin()':'doSignup()'}">${login?'Entrar':'Criar conta'}</button></div>
  <p style="margin-top:18px"><a class="lnk" onclick="S.auth='${login?'signup':'login'}';S.msg='';render()">${login?'Não tem conta? Criar uma agora':'Já tem conta? Entrar'}</a></p>
  ${login?`<p class="hint">Administrador de teste: ${ADMIN.email} / ${ADMIN.pass}</p>`:''}</div></div>`;
}
function doLogin(){
  const e = $('ae').value.trim().toLowerCase(), p = $('ap').value;
  let u = null;
  if(e===ADMIN.email && p===ADMIN.pass) u = { email:e, name:'Administrador' };
  else { const f = S.users.find(x => x.email===e && x.pass===p); if(f) u = { email:f.email, name:f.name } }
  if(!u) return say('E-mail ou senha incorretos.');
  S.user = u; S.msg=''; save(K.ses,u); render();
}
function doSignup(){
  const n = $('an').value.trim(), e = $('ae').value.trim().toLowerCase(), p = $('ap').value;
  if(!n||!e.includes('@')) return say('Informe seu nome e um e-mail válido.');
  if(p.length<6) return say('A senha precisa ter pelo menos 6 caracteres.');
  if(e===ADMIN.email||S.users.find(x => x.email===e)) return say('Este e-mail já tem conta. Use a opção Entrar.');
  S.users.push({ name:n, email:e, pass:p }); save(K.users,S.users);
  S.user = { email:e, name:n }; save(K.ses,S.user); S.msg=''; render();
}
function logout(){ S.user=null; S.msg=''; S.auth='login'; save(K.ses,null); render() }

/* ===== Tela 3: comunicação de alunos ===== */
function comView(){
  const hist = [...S.com].reverse();
  return `<h1>Comunicação do total de alunos</h1><p class="sub">A secretaria informa quantos alunos terão aula hoje. O chefe de cozinha pode ajustar esse número aqui mesmo, perto da hora da refeição.</p>
  <div class="card"><h2>Informar o total de alunos de hoje</h2><div class="row">
    <input id="ct" type="number" min="1" placeholder="Ex.: 320" style="width:110px" aria-label="Total de alunos">
    <input id="co" placeholder="Observação (opcional)" style="flex:1;min-width:160px" aria-label="Observação">
    <button class="btn p" onclick="sendCom()">Enviar para a cozinha</button></div>
    ${S.msg?`<div class="${S.msg.startsWith('Informe')?'err':'ok'}">${S.msg}</div>`:''}</div>
  <h2>Histórico</h2>
  ${hist.length? `<div class="card"><table><tr><th>Data e hora</th><th>Enviado por</th><th class="n">Alunos</th><th>Observação</th></tr>${hist.map(c =>
   `<tr><td>${new Date(c.at).toLocaleString('pt-BR')}</td><td>${esc(c.by)}</td><td class="n"><b>${c.total}</b></td><td>${esc(c.obs||'—')}</td></tr>`).join('')}</table></div>`
   : '<div class="empty">Nenhum registro ainda.</div>'}`;
}
function sendCom(){
  const t = parseInt($('ct').value,10);
  if(!t||t<1) return say('Informe um total de alunos maior que zero.');
  S.com.push({ total:t, obs:$('co').value.trim(), by:S.user.name||S.user.email, at:Date.now() }); save(K.com,S.com);
  say('Total enviado para a cozinha.');
}

/* ===== Tela 2: cadastro de refeições ===== */
const blank = () => ({ id:null, period:null, name:'', ings:[{ n:'', q:'', u:'g' }] });
function cadView(){
  if(!S.form) S.form = blank();
  const f = S.form, editing = !!f.id;
  const list = ['cafe','almoco','lanche'].map(p => {
    const ms = S.meals.filter(m => m.period===p);
    return `<div class="grp">${PER[p]}<small>${ms.length} refeições</small></div>` + (ms.length ? ms.map(m => `<div class="card" style="padding:14px 16px;margin-bottom:10px"><div class="meal">
      <div><b>${esc(m.name)}</b><small>${m.ings.length} ingredientes</small>
      <details><summary>Ver ingredientes (por pessoa)</summary><ul>${m.ings.map(i => `<li>${esc(i.n)}: ${fmtN(i.q)} ${i.u}</li>`).join('')}</ul></details></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn s" onclick="editMeal('${m.id}')">Editar</button><button class="btn s d" onclick="delMeal('${m.id}')">Excluir</button></div></div></div>`).join('')
      : '<div class="empty">Nenhuma refeição neste momento do dia.</div>');
  }).join('');
  return `<h1>Cadastro de refeições</h1><p class="sub">Cadastre as refeições do cardápio com os ingredientes de cada uma. As quantidades são sempre para uma pessoa.</p>
  <div class="card"><h2>${editing?'Editar refeição':'Nova refeição'}</h2>
   <div class="lb">Momento do dia</div><div class="row">${Object.entries(PER).map(([k,v]) => `<button class="chip ${f.period===k?'on':''}" onclick="syncForm();S.form.period='${k}';render()">${v}</button>`).join('')}</div>
   <label for="fn">Nome da refeição</label><input id="fn" value="${esc(f.name)}" placeholder="Ex.: Arroz, feijão e frango assado" style="width:100%;max-width:380px">
   <div class="lb">Ingredientes</div><div class="hint" style="margin:0 0 8px">Informe a quantidade de cada ingrediente para uma pessoa. Unidades: g (gramas), ml (mililitros) e un (unidades).</div>
   ${f.ings.map((i,x) => `<div class="ing"><input data-f="n" value="${esc(i.n)}" placeholder="Nome do ingrediente" aria-label="Ingrediente ${x+1}">
     <input data-f="q" type="number" min="0" step="any" value="${i.q}" placeholder="Por pessoa" aria-label="Quantidade por pessoa">
     <select data-f="u" aria-label="Unidade">${['g','ml','un'].map(u => `<option ${i.u===u?'selected':''}>${u}</option>`).join('')}</select>
     <button class="btn s" ${f.ings.length===1?'disabled':''} onclick="rmIng(${x})" aria-label="Remover ingrediente">✕</button></div>`).join('')}
   <div class="row"><button class="btn s" ${f.ings.length>=20?'disabled':''} onclick="addIng()">Adicionar ingrediente</button><span class="hint" style="margin:0">${f.ings.length} de 20 ingredientes</span></div>
   ${S.msg?`<div class="${S.msg.startsWith('Refeição')?'ok':'err'}">${S.msg}</div>`:''}
   <div class="row" style="margin-top:18px"><button class="btn p" onclick="saveMeal()">${editing?'Salvar alterações':'Cadastrar refeição'}</button><button class="btn" onclick="S.form=blank();S.msg='';render()">${editing?'Cancelar':'Limpar campos'}</button></div></div>
  <div class="row" style="justify-content:space-between;margin-top:30px"><h2 style="margin:0;font-size:20px">Refeições cadastradas (${S.meals.length})</h2>
   <a class="lnk" onclick="if(confirm('Restaurar o cardápio de exemplo? As refeições atuais serão substituídas.')){S.meals=seedMeals();save(K.meals,S.meals);S.form=blank();render()}">Restaurar cardápio de exemplo</a></div>${list}`;
}
function syncForm(){
  const f = S.form; if(!$('fn')) return; f.name = $('fn').value;
  document.querySelectorAll('.ing').forEach((row,x) => row.querySelectorAll('[data-f]').forEach(el => { f.ings[x][el.dataset.f] = el.value }));
}
function addIng(){ syncForm(); if(S.form.ings.length<20) S.form.ings.push({ n:'', q:'', u:'g' }); render() }
function rmIng(x){ syncForm(); S.form.ings.splice(x,1); render() }
function saveMeal(){
  syncForm(); const f = S.form;
  const ings = f.ings.filter(i => i.n.trim() || i.q!=='').map(i => ({ n:i.n.trim(), q:parseFloat(i.q), u:i.u }));
  if(!f.period) return say('Escolha o momento do dia.');
  if(!f.name.trim()) return say('Informe o nome da refeição.');
  if(!ings.length) return say('Adicione pelo menos 1 ingrediente.');
  if(ings.some(i => !i.n || !(i.q>0))) return say('Cada ingrediente precisa de nome e de uma quantidade maior que zero.');
  const m = { id:f.id || 'm'+Date.now(), period:f.period, name:f.name.trim(), ings };
  if(f.id) S.meals = S.meals.map(x => x.id===f.id ? m : x); else S.meals.push(m);
  save(K.meals,S.meals); const edited = !!f.id; S.form = blank(); say('Refeição '+(edited?'atualizada':'cadastrada')+'. Ela já aparece em Cálculo do dia.');
}
function editMeal(id){ const m = S.meals.find(x => x.id===id); S.form = JSON.parse(JSON.stringify(m)); S.msg=''; render(); scrollTo(0,0) }
function delMeal(id){ const m = S.meals.find(x => x.id===id); if(!confirm('Excluir "'+m.name+'"?')) return;
  S.meals = S.meals.filter(x => x.id!==id); save(K.meals,S.meals); if(S.calc.meal===id){ S.calc.meal=null; S.calc.report=null } render() }

/* ===== Tela 1: cálculo do dia ===== */
function calcView(){
  const c = S.calc, com = latestCom();
  if(c.total==='' && com) c.total = com.total;
  const ok = c.total>0, ms = c.period ? S.meals.filter(m => m.period===c.period) : [];
  return `<h1>Cálculo do dia</h1><p class="sub">Escolha a refeição de hoje para calcular quanto separar de cada ingrediente.</p>
  <div class="card"><h2>1. Total de alunos</h2><div class="row"><input id="tt" type="number" min="1" placeholder="Ex.: 320" value="${c.total}" style="width:120px" aria-label="Total de alunos">
   <button class="btn" onclick="confirmTotal()">Confirmar total</button></div>
   <div class="hint">${ok ? (com && com.total===c.total ? `Total informado pela secretaria hoje: ${com.total} alunos. Você pode ajustar.` : `Calculando para ${c.total} alunos.`) : 'Nenhum total foi informado pela secretaria ainda. Informe um valor acima.'}</div></div>
  <div class="card ${ok?'':'off'}"><h2>2. Tipo de refeição</h2><div class="row">${Object.entries(PER).map(([k,v]) => `<button class="chip ${c.period===k?'on':''}" onclick="S.calc.period='${k}';S.calc.meal=null;S.calc.report=null;render()">${v}</button>`).join('')}</div></div>
  <div class="card ${c.period?'':'off'}"><h2>3. Refeição do cardápio</h2>
   ${!c.period ? '<div class="hint">Escolha primeiro o tipo de refeição.</div>' : ms.length ? `<div class="row">${ms.map(m => `<button class="chip ${c.meal===m.id?'on':''}" onclick="S.calc.meal='${m.id}';S.calc.report=null;render()">${esc(m.name)}</button>`).join('')}</div>`
   : '<div class="hint">Nenhuma refeição cadastrada neste momento do dia. Cadastre em Cadastro de refeições.</div>'}</div>
  <button class="btn p" ${ok&&c.meal?'':'disabled'} onclick="S.calc.report=true;render()">Gerar relatório</button>
  ${c.report && c.meal ? reportView() : ''}`;
}
function confirmTotal(){ const t = parseInt($('tt').value,10); S.calc.total = t>0 ? t : ''; S.calc.report=null; render() }
function reportView(){
  const m = S.meals.find(x => x.id===S.calc.meal), n = S.calc.total; if(!m) return '';
  return `<div class="card" style="margin-top:24px"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Relatório de ingredientes</h2>
   <div class="hint" style="margin:2px 0 0">${PER[m.period]}: <b>${esc(m.name)}</b> · ${n} alunos · ${todayLabel()}</div></div><button class="btn s noprint" onclick="print()">Imprimir</button></div>
   <table style="margin-top:12px"><tr><th>Ingrediente</th><th class="n">Por pessoa</th><th class="n">Total para ${n} alunos</th></tr>
   ${m.ings.map(i => `<tr><td>${esc(i.n)}</td><td class="n">${fmtN(i.q)} ${i.u}</td><td class="n"><b>${fmtQ(i.q*n,i.u)}</b></td></tr>`).join('')}</table></div>`;
}

/* ===== Painel da cozinha ===== */
function painelView(){
  const com = latestCom(), c = S.calc, m = S.meals.find(x => x.id===c.meal);
  return `<h1>Painel da cozinha</h1><p class="sub">Resumo do dia para quem está no preparo. ${todayLabel()}.</p>
  <div class="card"><div class="lb" style="margin-top:0">Alunos hoje</div>${com ? `<div class="big">${com.total}</div><div class="hint">Enviado por ${esc(com.by)} às ${new Date(com.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}${com.obs?' · '+esc(com.obs):''}</div>`
   : '<div class="empty">A secretaria ainda não informou o total de hoje.</div>'}</div>
  ${c.report && m ? reportView() : `<div class="empty">Nenhum relatório gerado. Vá em Cálculo do dia, escolha a refeição e clique em Gerar relatório.<br><br><button class="btn p" onclick="go('calc')">Ir para Cálculo do dia</button></div>`}`;
}

/* ===== Tela 4: usuários e acessos ===== */
function usrView(){
  const sel = S.newRole || 'secretaria';
  return `<h1>Usuários e acessos</h1><p class="sub">Aqui você libera o perfil de acesso de cada e-mail. A pessoa precisa criar a própria conta (e-mail e senha) na tela de login. Aqui você só diz qual perfil aquele e-mail deve ter.</p>
  <div class="card" style="padding:14px 18px"><b>${ADMIN.email}</b> <span class="badge">Administrador</span><div class="hint">Administrador padrão do projeto. Não pode ser alterado por aqui.</div></div>
  <div class="card"><h2>Liberar acesso para um e-mail</h2><label for="ue">E-mail</label><input id="ue" type="email" placeholder="pessoa@escola.gov.br" style="width:100%;max-width:300px">
   <div class="lb">Perfil</div><div class="row">${Object.entries(ROLES).map(([k,v]) => `<button class="chip ${sel===k?'on':''}" onclick="S.newRole='${k}';S.msg='';syncUe();render()">${v}</button>`).join('')}</div>
   ${S.msg?`<div class="${S.msg.startsWith('Acesso')?'ok':'err'}">${S.msg}</div>`:''}
   <div class="row" style="margin-top:18px"><button class="btn p" onclick="grant()">Liberar acesso</button><button class="btn" onclick="S.msg='';$('ue').value=''">Limpar campos</button></div></div>
  <h2>E-mails com acesso liberado (${S.acc.length})</h2>
  ${S.acc.length ? S.acc.map(a => { const has = S.users.some(u => u.email===a.email);
    return `<div class="card" style="padding:14px 18px;margin-bottom:10px"><div class="meal"><div><b>${esc(a.email)}</b> <span class="badge">${ROLES[a.role]}</span>
    <div class="hint" style="margin:2px 0 0">${has?'Conta já criada.':'Ainda não criou a conta.'}</div></div><button class="btn s d" onclick="revoke('${esc(a.email)}')">Remover acesso</button></div></div>` }).join('')
   : '<div class="empty">Nenhum e-mail liberado ainda, além do administrador padrão acima.</div>'}`;
}
function syncUe(){ S.ue = $('ue') ? $('ue').value : S.ue }
function grant(){
  const e = $('ue').value.trim().toLowerCase();
  if(!e.includes('@')) return say('Informe um e-mail válido.');
  if(e===ADMIN.email) return say('Este e-mail já é o administrador padrão.');
  const r = S.newRole || 'secretaria', ex = S.acc.find(a => a.email===e);
  if(ex) ex.role = r; else S.acc.push({ email:e, role:r });
  save(K.acc,S.acc); say('Acesso liberado para '+e+' como '+ROLES[r]+'.');
}
function revoke(e){ if(confirm('Remover o acesso de '+e+'?')){ S.acc = S.acc.filter(a => a.email!==e); save(K.acc,S.acc); render() } }

render();
</script>
